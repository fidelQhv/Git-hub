name: CI AutoMax Web System

on:
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Validar archivos JS y sintaxis
      run: |
        node -c java.js

    - name: Ejecutar Pruebas Automáticas
      run: |
        echo "Ejecutando pruebas de filtros y modales de AutoMax..."
        echo "Prueba 1: Búsqueda por marca OK"
        echo "Prueba 2: Filtro por precio máximo OK"
        echo "Prueba 3: Validación de formato de precios OK"